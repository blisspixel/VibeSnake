name: Player build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: player-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Package playable source build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create playable source archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/vibesnake-player"
          mkdir -p "${STAGE}"
          # Ship everything a player needs: code, assets (including radio), docs entry points.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.tools' \
            --exclude '.dotnet' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '.mypy_cache' \
            --exclude '__pycache__' \
            --exclude 'TestResults' \
            --exclude 'qa_reports' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude '*.pyc' \
            ./ "${STAGE}/VibeSnake/"
          (
            cd "${STAGE}"
            zip -r "${GITHUB_WORKSPACE}/dist/VibeSnake-player-source.zip" VibeSnake
          )
          python - <<'PY'
          from pathlib import Path
          import hashlib
          dist = Path("dist")
          lines = []
          for path in sorted(dist.iterdir()):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.name}")
          (dist / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload player artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vibesnake-player-build
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/VibeSnake-player-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          cat > "${NOTES}" <<'EOF'
          Playable Vibe Snake build.

          Easy path:
            git clone https://github.com/blisspixel/VibeSnake.git
            cd VibeSnake
            python3.14 -m venv .venv && source .venv/bin/activate
            python -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock
            python -m pip install --no-deps --no-build-isolation -e .
            vibesnake

          Update later:
            vibesnake update

          Includes the eight-station offline radio catalog under assets/audio/radio/.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/VibeSnake-player-source.zip \
            dist/SHA256SUMS.txt \
            --generate-notes \
            --notes-file "${NOTES}" \
            --title "Vibe Snake ${GITHUB_REF_NAME}"
