name: Player build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: player-build-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package playable source build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Build wheel and sdist
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m build --no-isolation

      - name: Create playable source archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/vibesnake-player"
          mkdir -p "${STAGE}"
          # Ship everything a player needs: code, assets (including radio), docs entry points.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.tools' \
            --exclude '.dotnet' \
            --exclude '.godot' \
            --exclude 'bin' \
            --exclude 'obj' \
            --exclude '*.egg-info' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '.mypy_cache' \
            --exclude '__pycache__' \
            --exclude 'TestResults' \
            --exclude 'qa_reports' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude '*.pyc' \
            ./ "${STAGE}/VibeSnake/"
          (
            cd "${STAGE}"
            zip -r "${GITHUB_WORKSPACE}/dist/VibeSnake-player-source.zip" VibeSnake
          )
          python - <<'PY'
          from pathlib import Path
          import hashlib
          dist = Path("dist")
          lines = []
          for path in sorted(dist.iterdir()):
              if path.is_file():
                  with path.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  lines.append(f"{digest}  {path.name}")
          (dist / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload player artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-player-build
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/VibeSnake-player-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          # This is an inter-job handoff. The publish job copies the same bytes
          # into the immutable source release, so a long-lived duplicate only consumes
          # Actions artifact storage.
          retention-days: 1

  publish:
    name: Publish qualified source build
    if: needs.package.result == 'success'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out qualified release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download qualified source build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibesnake-player-build
          path: dist

      - name: Publish immutable source snapshot on main
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          cat > "${NOTES}" <<EOF
          Continuous playable build from \`main\` (\`${QUALIFIED_SHA::7}\`).

          This is a source and reference prerelease, not a signed supported player artifact. It includes the post-1.0 Agent Arena developer preview with local MCP play, verified replays, and a read-only Godot viewer.

          **Native source player**

          Download \`VibeSnake-player-source.zip\`, verify it against \`SHA256SUMS.txt\`, and unzip it. PowerShell 7 and the .NET 10.0.403 SDK are required. The launcher downloads and verifies the pinned Godot 4.7.1 .NET editor on first use.

          \`\`\`powershell
          cd VibeSnake
          .\\play.ps1
          \`\`\`

          On macOS or Linux:

          \`\`\`bash
          cd VibeSnake
          ./play.sh
          \`\`\`

          **Frozen Python reference**

          The wheel and source distribution are the migration oracle and regression reference. They are not the default Godot/C# player and are not required by \`play.ps1\` or \`play.sh\`.

          Includes the eight-station offline radio catalog under \`assets/audio/radio/\`.
          EOF

          printf '\n## Development changes\n\n' >> "${NOTES}"
          awk '/^## Unreleased/ { active = 1; next } active && /^## / { exit } active && /^- / { if (++entries > 10) exit } active { print }' \
            CHANGELOG.md >> "${NOTES}"
          printf '\n[Full changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "${GITHUB_REPOSITORY}" "${QUALIFIED_SHA}" >> "${NOTES}"

          bash scripts/publish_source_release.sh dist "${NOTES}"
