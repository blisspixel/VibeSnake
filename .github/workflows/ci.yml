name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYTHONPATH: src
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install hash-locked project and development tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation .

      - name: Verify dependency lock freshness
        run: |
          python scripts/lock_python_dependencies.py
          python scripts/lock_python_dependencies.py --profile runtime

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Enforce source policy
        run: python scripts/check_source_policy.py

      - name: Audit Python dependencies
        if: matrix.python-version == '3.14'
        run: python -m pip_audit --strict --disable-pip --require-hashes --requirement requirements-ci.lock

      - name: Audit player runtime dependencies
        if: matrix.python-version == '3.14'
        run: python -m pip_audit --strict --disable-pip --require-hashes --requirement requirements-runtime.lock

      - name: Check documentation links
        run: python scripts/check_docs.py

      - name: Check product version alignment
        run: python scripts/check_product_version.py

      - name: Check candidate freeze policy
        run: python scripts/check_candidate_freeze.py

      - name: Qualify manual product matrix handoff
        if: matrix.python-version == '3.14'
        run: >-
          python scripts/check_manual_product_matrix.py
          --output TestResults/manual-product-matrix/manual_product_matrix_handoff.json

      - name: Qualify external validation handoff
        if: matrix.python-version == '3.14'
        run: >-
          python scripts/check_external_validation.py
          --output TestResults/external-validation/external_validation_handoff.json

      - name: Qualify release-material foundation
        if: matrix.python-version == '3.14'
        run: >-
          python scripts/check_release_materials.py
          --output TestResults/release-materials/release_materials_handoff.json

      - name: Qualify release rehearsal handoff
        if: matrix.python-version == '3.14'
        run: >-
          python scripts/check_release_rehearsal.py
          --output TestResults/release-rehearsal/release_rehearsal_handoff.json

      - name: Qualify stable promotion guard
        if: matrix.python-version == '3.14'
        run: >-
          python scripts/check_stable_promotion.py
          --output TestResults/stable-promotion/stable_promotion_handoff.json

      - name: Verify current README screenshots
        run: python scripts/capture_readme_screenshots.py --check

      - name: Verify deterministic station badges
        if: matrix.python-version == '3.14'
        run: python scripts/visual_generate_badges.py --check

      - name: Verify deterministic project logo
        if: matrix.python-version == '3.14'
        run: python scripts/visual_generate_logo.py --check

      - name: Verify deterministic content inventory
        if: matrix.python-version == '3.14'
        run: python scripts/content_inventory.py --check

      - name: Verify shared Python-to-C# traces
        run: |
          python -m vibesnake.qa.shared_traces --check
          python -m vibesnake.qa.shared_rule_traces --check
          python -m vibesnake.qa.shared_power_traces --check
          python -m vibesnake.qa.shared_phase_shift_traces --check
          python -m vibesnake.qa.shared_last_stand_traces --check
          python -m vibesnake.qa.shared_remaining_power_traces --check
          python -m vibesnake.qa.shared_achievement_candidate_traces --check

      - name: Test with coverage
        run: python -m pytest --cov=vibesnake --cov-report=term-missing --cov-report=xml

      - name: Run seeded gameplay QA campaign
        if: matrix.python-version == '3.14'
        run: python -m vibesnake.qa --seeds 0 1 2 3 4 --steps 500 --compact --output qa_reports/core.json

      - name: Upload Python QA evidence
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-qa-evidence
          path: |
            coverage.xml
            qa_reports/core.json
            TestResults/manual-product-matrix/manual_product_matrix_handoff.json
            TestResults/external-validation/external_validation_handoff.json
            TestResults/release-materials/release_materials_handoff.json
            TestResults/release-rehearsal/release_rehearsal_handoff.json
            TestResults/stable-promotion/stable_promotion_handoff.json
          if-no-files-found: error
          retention-days: 14

  native-rules:
    name: Native rules on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VIBESNAKE_DIVERGENCE_DIR: TestResults/native/divergence

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            game/packages.lock.json
            native/src/VibeSnake.Persistence/packages.lock.json
            native/src/VibeSnake.Rules/packages.lock.json
            native/tests/VibeSnake.Rules.Tests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore native/VibeSnake.slnx --locked-mode

      - name: Build native solution
        run: dotnet build native/VibeSnake.slnx --configuration Release --no-restore

      - name: Check C# formatting and analyzers
        run: dotnet format native/VibeSnake.slnx --verify-no-changes --no-restore

      - name: Test native rules with coverage floor
        shell: pwsh
        run: ./scripts/test_native_coverage.ps1

      - name: Upload native parity divergence evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-parity-divergence-${{ matrix.os }}
          path: TestResults/native/divergence
          if-no-files-found: ignore
          retention-days: 14

  godot-smoke:
    name: Native player smoke on ${{ matrix.os }}
    needs: native-rules
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: linux-x64
            template_path: ~/.local/share/godot/export_templates
          - os: macos-latest
            platform_id: macos-universal
            template_path: ~/Library/Application Support/Godot/export_templates
          - os: windows-latest
            platform_id: windows-x64
            template_path: ~/AppData/Roaming/Godot/export_templates

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache verified Godot editor archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot/downloads
          key: godot-editor-${{ matrix.platform_id }}-${{ hashFiles('native/toolchain.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install verified Godot build
        id: godot
        shell: pwsh
        run: ./scripts/install_godot.ps1

      - name: Qualify native build and Godot scene
        shell: pwsh
        run: ./scripts/test_native.ps1 -GodotExecutable "${{ steps.godot.outputs.godot-path }}"

      - name: Cache selected Godot export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.template_path }}
          key: godot-templates-${{ matrix.platform_id }}-${{ hashFiles('native/toolchain.json') }}

      - name: Install verified native export templates
        shell: pwsh
        run: ./scripts/install_godot_templates.ps1 -PlatformId "${{ matrix.platform_id }}"

      - name: Export and smoke native player outside checkout
        id: player
        shell: pwsh
        env:
          VIBESNAKE_QUALIFICATION_BUILD_MODE: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'Release' || 'Debug' }}
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP "vibesnake-${{ matrix.platform_id }}"
          $candidateLaunchCount = if ($env:VIBESNAKE_QUALIFICATION_BUILD_MODE -eq "Release") { 100 } else { 0 }
          $exportArguments = @{
            GodotExecutable = "${{ steps.godot.outputs.godot-path }}"
            OutputDirectory = $outputDirectory
            EvidenceDirectory = "TestResults/native"
            BuildMode = $env:VIBESNAKE_QUALIFICATION_BUILD_MODE
            CandidateLaunchCount = $candidateLaunchCount
            SkipTemplateInstall = $true
          }
          if ($env:VIBESNAKE_QUALIFICATION_BUILD_MODE -eq "Release") {
            $exportArguments["CandidateLifecycle"] = $true
          }
          ./scripts/test_native_export.ps1 @exportArguments

      - name: Upload native qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-${{ matrix.platform_id }}-qualification-evidence
          path: TestResults/native/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload native qualification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-${{ matrix.platform_id }}-manifest
          path: ${{ steps.player.outputs.artifact-root }}/artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload qualified native player for explicit release qualification
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-${{ matrix.platform_id }}-unsigned-qualified
          path: ${{ steps.player.outputs.artifact-root }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unsigned channel-shape qualification package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-${{ matrix.platform_id }}-unsigned-channel-shape
          path: ${{ steps.player.outputs.package-root }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release-matrix:
    name: Cross-bind native release matrix
    needs: godot-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download native qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vibesnake-*-qualification-evidence
          path: release-matrix

      - name: Download native artifact manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vibesnake-*-manifest
          path: release-matrix

      - name: Qualify the complete native matrix
        run: |
          build_mode=Debug
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/* ]]; then
            build_mode=Release
          fi
          python scripts/check_release_matrix.py release-matrix \
            --expected-revision "${{ github.sha }}" \
            --expected-build-mode "$build_mode" \
            --output TestResults/release-matrix/release_matrix.json

      - name: Upload release matrix evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-release-matrix
          path: TestResults/release-matrix/release_matrix.json
          if-no-files-found: error
          retention-days: 30

  attest-qualified-manifests:
    name: Attest qualified manifest for ${{ matrix.platform_id }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [godot-smoke, release-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        platform_id: [windows-x64, linux-x64, macos-universal]

    steps:
      - name: Download qualified artifact manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibesnake-${{ matrix.platform_id }}-manifest
          path: attestation-input

      - name: Attest qualified artifact manifest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attestation-input/artifact-manifest.json

      - name: Upload detached provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesnake-${{ matrix.platform_id }}-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
