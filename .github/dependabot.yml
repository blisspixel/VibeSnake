version: 2
# Keep dependency noise low: monthly batches, few open PRs, grouped updates.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-tooling:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: "/native"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      native-nuget:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: "/game"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      game-nuget:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
