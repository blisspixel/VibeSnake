version: 2
# Version-update PRs disabled (open-pull-requests-limit: 0) so the public
# repo stays a single clean main branch. Security updates still apply when
# GitHub reports vulnerable deps. Re-enable monthly groups when ready to batch.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: nuget
    directory: "/native"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: nuget
    directory: "/game"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
