repos:
  - repo: local
    hooks:
      - id: source-policy
        name: source policy
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- source .
        language: system
        pass_filenames: false
      - id: ruff
        name: Ruff
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check src tests scripts
        language: system
        pass_filenames: false
      - id: dependency-lock
        name: dependency lock freshness
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- locks .
        language: system
        pass_filenames: false
      - id: documentation
        name: documentation links
