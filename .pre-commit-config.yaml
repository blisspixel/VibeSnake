repos:
  - repo: local
    hooks:
      - id: source-policy
        name: source policy
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- source .
        language: system
        pass_filenames: false
      - id: ruff
        name: Ruff
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check src tests scripts
        language: system
        pass_filenames: false
      - id: dependency-lock
        name: dependency lock freshness
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- locks .
        language: system
        pass_filenames: false
      - id: documentation
        name: documentation links
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- docs .
        language: system
        pass_filenames: false
      - id: readme-screenshots
        name: current README screenshots
        entry: python scripts/capture_readme_screenshots.py --check
        language: system
        pass_filenames: false
      - id: station-badges
        name: deterministic station badges
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- badges .
        language: system
        pass_filenames: false
      - id: project-logo
        name: deterministic project logo
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- logo .
        language: system
        pass_filenames: false
      - id: content-inventory
        name: content inventory freshness
        entry: dotnet run --project native/tools/RepositoryChecks/RepositoryChecks.csproj -- inventory .
        language: system
        pass_filenames: false
      - id: shared-traces
        name: shared parity fixtures
        entry: python -m vibesnake.qa.shared_traces --check
        language: system
        pass_filenames: false
      - id: shared-rule-traces
        name: shared rule fixtures
        entry: python -m vibesnake.qa.shared_rule_traces --check
        language: system
        pass_filenames: false
      - id: shared-power-traces
        name: shared power fixtures
        entry: python -m vibesnake.qa.shared_power_traces --check
        language: system
        pass_filenames: false
